<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="The Salon — 多智能体辩论沙龙">
    <title>The Salon · AI 辩论</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css?v=23">
    <!-- Vendor deps served locally (static/vendor/) to avoid CDN latency/blocking.
         Pinned versions; bump the ?v= query when updating a file. -->
    <script src="/static/vendor/marked.min.js?v=12.0.2" defer></script>
    <script src="/static/vendor/lucide.min.js?v=0.469.0" defer></script>
</head>
<body>
    <div class="app" id="app">
        <aside class="sidebar" aria-label="侧边栏">
            <header class="brand">
                <h1>The Salon</h1>
                <div class="brand-actions">
                    <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题">
                        <span data-lucide="moon" class="icon-slot"></span>
                    </button>
                </div>
            </header>

            <section class="sidebar-section" aria-labelledby="topic-label">
                <label class="field-label" id="topic-label" for="topic-input">辩论主题</label>
                <textarea id="topic-input" rows="3" placeholder="输入辩论主题 — Ctrl+Enter 直接开始"></textarea>
                <div class="field-row">
                    <label class="field-label" for="max-rounds">最大轮次</label>
                    <input type="number" id="max-rounds" class="max-rounds-input" min="1" max="50" step="1" value="10">
                    <button class="refine-btn" id="refine-topic-btn" type="button" title="使用 AI 优化主题表述">
                        <span data-lucide="sparkles" class="icon-slot"></span>
                        <span>优化</span>
                    </button>
                </div>
                <label class="option-line" for="search-enabled" title="关闭后全场禁用联网搜索；原本就不搜索的辩手不受影响">
                    <input type="checkbox" id="search-enabled" checked>
                    <span>启用联网搜索</span>
                </label>
            </section>

            <section class="sidebar-section" aria-labelledby="debaters-label">
                <span class="field-label" id="debaters-label">辩手（拖拽以调整顺序）</span>
                <div id="debater-list" class="debater-list" role="list"></div>
            </section>

            <section class="sidebar-section">
                <div class="control-row">
                    <button id="start-btn" class="primary-btn" type="button">开始辩论</button>
                    <button id="stop-btn" type="button" disabled>暂停</button>
                    <button id="resume-btn" type="button" disabled>继续</button>
                </div>
            </section>

            <section class="sidebar-section">
                <h3>自定义辩手</h3>
                <input type="text" id="custom-name" placeholder="名称" autocomplete="off">
                <div class="inline-inputs">
                    <input type="color" id="custom-color" value="#2b2620" aria-label="选择颜色">
                    <input type="text" id="custom-avatar" placeholder="表情符号" maxlength="2" autocomplete="off">
                </div>
                <select id="custom-stance" aria-label="立场">
                    <option value="正方">正方</option>
                    <option value="反方">反方</option>
                    <option value="中立" selected>中立</option>
                </select>
                <textarea id="custom-personality" rows="3" placeholder="性格描述 —— 越具体，表现越鲜明"></textarea>
                <button id="add-debater-btn" type="button">添加辩手</button>
            </section>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h2 id="chat-title">等待开启一场辩论…</h2>
                <div class="chat-header-actions">
                    <button id="judge-btn" class="sage-btn" type="button" hidden disabled>
                        <span data-lucide="gavel" class="icon-slot"></span>
                        <span>请裁判点评</span>
                    </button>
                    <button id="download-btn" class="navy-btn" type="button" disabled>
                        <span data-lucide="download" class="icon-slot"></span>
                        <span>下载</span>
                    </button>
                </div>
            </header>

            <div class="round-progress" id="round-progress" role="progressbar" aria-label="辩论进度" aria-valuemin="0" aria-valuemax="100">
                <div class="round-progress-fill" id="round-progress-fill"></div>
            </div>

            <div class="round-info" id="round-info">
                <span data-lucide="user" class="icon-slot"></span>
                <span>当前发言：</span>
                <span class="current-speaker" id="current-speaker">等待开始…</span>
                <span class="round-badge" id="round-badge">第 0 / 0 轮</span>
            </div>

            <div id="messages" class="messages" aria-live="polite" aria-atomic="false" aria-relevant="additions"></div>

            <div class="connection-indicator" id="connection-indicator" role="status"></div>

            <button class="search-toggle-btn" id="search-toggle-btn" type="button" title="搜索消息 (Ctrl+K)" aria-label="搜索消息">
                <span data-lucide="search" class="icon-slot"></span>
            </button>

            <form class="input-bar" id="input-bar" onsubmit="return false">
                <textarea id="user-input" placeholder="参与讨论 — Enter 发送，Shift+Enter 换行" rows="1" disabled></textarea>
                <button id="send-btn" class="primary-btn" type="submit" disabled>
                    <span data-lucide="send-horizontal" class="icon-slot"></span>
                    <span>发送</span>
                </button>
            </form>
        </main>
    </div>

    <dialog class="search-dialog" id="search-dialog" aria-label="搜索辩论消息">
        <div class="search-dialog-header">
            <h3>搜索消息</h3>
            <button class="icon-btn" id="search-close" type="button" aria-label="关闭">
                <span data-lucide="x" class="icon-slot"></span>
            </button>
        </div>
        <div class="search-input-wrapper">
            <span data-lucide="search" class="icon"></span>
            <input type="text" id="search-input" placeholder="输入关键词…（Esc 关闭）" autocomplete="off">
        </div>
        <div id="search-results" class="search-results"></div>
    </dialog>

    <script type="module" src="/static/app.js?v=23"></script>
</body>
</html>
